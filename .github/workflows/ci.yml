name: CI

# Gatilhos (D-10, D-13): PR para a main, push na main (gera o run de CI do qual o deploy depende) e
# disparo manual. Sem filtro de caminhos: um PR só de documentação também precisa produzir o check
# obrigatório `ci-ok`, senão o merge travaria. Este repositório é público (D-07): só o gatilho
# `pull_request` roda código de PR, sempre com permissões mínimas e sem segredos.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# O check obrigatório vale para o commit mais recente do PR; um run antigo cancelado não libera merge
# porque o `ci-ok` trata `cancelled` como falha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm turbo run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        # Mesma imagem do compose.test.yaml; credencial só de teste, banco descartável do runner.
        image: supabase/postgres:17.12.0.000
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL_TEST_ADMIN: postgresql://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O cliente Prisma é gerado pelo `build` do @blog/api, do qual estas tarefas dependem (turbo.json).
      - run: pnpm turbo run test test:http test:integration --filter=@blog/api --filter=@blog/shared

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test test:integration build --filter=@blog/web

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Lê o .gitleaks.toml da raiz (regras padrão mais a allowlist de literais de teste local).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-ok:
    if: always()
    needs: [lint, typecheck, test-api, test-web, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Só `success` em todos os jobs libera o merge: falha, cancelamento e job pulado reprovam.
      - name: Reprovar se algum job obrigatório não terminou com sucesso
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "Algum job obrigatório não terminou com sucesso."
          exit 1
      - run: echo "Todos os jobs obrigatórios passaram."
